apiVersion: batch/v1
kind: Job
metadata:
  name: g4-gemma4-12b-bench-guidellm
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels:
        app: g4-gemma4-12b-bench-guidellm
    spec:
      shareProcessNamespace: true
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-rtx-pro-6000
        cloud.google.com/gke-spot: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: vllm-server
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token-secret
              key: HF_TOKEN
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - "--model"
        - "google/gemma-4-12b"
        - "--tensor-parallel-size"
        - "1"
        - "--gpu-memory-utilization"
        - "0.95"
        - "--port"
        - "8000"
        - "--max-model-len"
        - "8192"
        - "--max-num-seqs"
        - "128"
        - "--max-num-batched-tokens"
        - "8192"
        - "--enable-prefix-caching"
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      - name: guidellm-client
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/secret/key.json"
        image: vllm/vllm-openai:latest
        command: ["bash", "-c"]
        args:
        - |
          set -ex
          trap 'pkill -f "[v]llm" || true' EXIT
          pip install guidellm
          MODEL="google/gemma-4-12b"
          BASE_URL="http://localhost:8000"
          RESULT_DIR="/workspace/output"
          
          echo "Waiting for vLLM server..."
          until curl -sf "$BASE_URL/health"; do
            sleep 5
          done
          echo "Server is ready. Starting benchmarks..."
          mkdir -p "$RESULT_DIR"

          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          timeout --signal=KILL 10800 guidellm run \
            --backend kind=openai_http,target="$BASE_URL",request_format=/v1/completions,model="$MODEL" \
            --profile kind=sweep,sweep_size=20,strategy_type=poisson \
            --constraint kind=max_duration,seconds=300 \
            --data '{"kind": "synthetic_text", "prompt_tokens": 300, "output_tokens": 7, "output_tokens_max": 30, "prefix_buckets": [{"bucket_weight": 100, "prefix_count": 1, "prefix_tokens": 4000}]}' \
            --output "kind=json,path=$RESULT_DIR/benchmarks.json" \
            --output "kind=csv,path=$RESULT_DIR/benchmarks.csv" \
            --output "kind=html,path=$RESULT_DIR/benchmarks.html" || true
          echo "BENCHMARKING COMPLETE"
          pip install google-cloud-storage
          python3 -c "from google.cloud import storage; import os, glob; c = storage.Client(); b = c.bucket('roblox-g4-v6e-benchmarking'); [b.blob(f'g4-gemma4-12b/${TIMESTAMP}/{os.path.basename(f)}').upload_from_filename(f) for f in glob.glob('/workspace/output/*')]"
        volumeMounts:
        - name: gcs-key
          mountPath: /secret
          readOnly: true
        - name: output-volume
          mountPath: /workspace/output
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: output-volume
        emptyDir: {}
      - name: gcs-key
        secret:
          secretName: gcs-key
