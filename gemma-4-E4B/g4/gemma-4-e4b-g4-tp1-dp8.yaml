apiVersion: batch/v1
kind: Job
metadata:
  name: gemma-4-e4b-g4-tp1-dp8
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      shareProcessNamespace: true
      nodeSelector:
        cloud.google.com/gke-accelerator: "nvidia-rtx-pro-6000"
        # The g4-standard-48 node in this cluster carries the same accelerator
        # label but only has 1 GPU, so pin to the 8-GPU pool explicitly.
        cloud.google.com/gke-nodepool: "g4-384-pool"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: vllm-server
        image: vllm/vllm-openai:nightly
        command:
        - "vllm"
        args:
        - "serve"
        - "google/gemma-4-E4B"
        # 8B BF16 weights (~16GB) fit many times over in 96GB, and these cards have no
        # NVLink, so TP would only add PCIe all-reduces. 8 independent DP replicas.
        - "--tensor-parallel-size"
        - "1"
        - "--data-parallel-size"
        - "8"
        - "--dtype"
        - "bfloat16"
        # Weights are only ~15GiB here, so 0.90 already leaves ~70GiB for KV cache.
        # Pushing higher buys nothing for this workload.
        - "--gpu-memory-utilization"
        - "0.90"
        # Workload is 450 random + 50 fixed prefix input tokens and 1 output token.
        - "--max-model-len"
        - "512"
        # Kept at the v6e value. E4B is roughly 4x cheaper per token than the 31B, so
        # an 8192-token prefill step stays well inside the 1s p90 budget.
        - "--max-num-batched-tokens"
        - "8192"
        # num_kv_shared_layers=18 of 42 layers and only 2 KV heads means ~48MiB per
        # 512-token sequence, so the KV pool holds well over a thousand. Raised from
        # 128 to 512 so the engine is not the bottleneck at high concurrency.
        - "--max-num-seqs"
        - "512"
        # The 50-token safety-policy prefix is shared by every request.
        - "--enable-prefix-caching"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
        - "--trust-remote-code"
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: /hf-cache
        # DP replicas are separate processes; spawn avoids CUDA fork issues.
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: "spawn"
        - name: NCCL_DEBUG
          value: "WARN"
        - name: VLLM_LOGGING_LEVEL
          value: "INFO"
        resources:
          limits:
            nvidia.com/gpu: "8"
          requests:
            nvidia.com/gpu: "8"
        volumeMounts:
        - name: hf-cache
          mountPath: /hf-cache
        # The default 64MB /dev/shm is far too small for 8 DP engine processes.
        - name: dshm
          mountPath: /dev/shm
      - name: native-bench-client
        image: vllm/vllm-openai:nightly
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/secret/key.json"
        # Keep the client off the GPUs entirely.
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        command:
        - "bash"
        - "-c"
        - |
          set -ex
          trap 'pkill -f vllm || true' EXIT

          echo "Waiting for vLLM server..."
          until curl -sf http://localhost:8000/health; do
            sleep 5
          done
          echo "Server is ready. Starting native google/gemma-4-E4B benchmarks..."

          mkdir -p /workspace/output
          echo "Installing google-cloud-storage upfront..."
          pip install google-cloud-storage

          # The GPU image may not carry the same bench flags as the TPU image.
          WARMUP_FLAG=""
          if vllm bench serve --help 2>&1 | grep -q -- "--num-warmups"; then
            WARMUP_FLAG="--num-warmups 20"
          fi
          echo "Using warmup flag: '${WARMUP_FLAG}'"

          for concurrency in 1 2 4 8 16 32 48 64 96 128 160 192 256 320 384 512 640 768 1024; do
            if [ "${concurrency}" -ge 96 ]; then
              num_prompts=$((concurrency * 20))
            else
              num_prompts=1000
            fi
            echo "Running native benchmark with concurrency $concurrency, input len 450, prefix len 50, output len 1..."
            if vllm bench serve \
                --model google/gemma-4-E4B \
                --dataset-name random \
                --random-input-len 450 \
                --random-prefix-len 50 \
                --random-output-len 1 \
                --random-range-ratio 0.0 \
                --num-prompts ${num_prompts} \
                ${WARMUP_FLAG} \
                --max-concurrency $concurrency \
                --metric-percentiles 50,90,95,99 \
                --percentile-metrics ttft,tpot,itl,e2el \
                --save-result \
                --result-dir /workspace/output \
                --result-filename native_c${concurrency}_results.json \
                --base-url http://localhost:8000; then
              echo "Uploading native_c${concurrency}_results.json to GCS immediately..."
              python3 -c "from google.cloud import storage; c = storage.Client(); b = c.bucket('llama-vllm-results-bucket'); b.blob('gemma-4-e4b-native-bench/g4/tp1-dp8_results/native_c${concurrency}_results.json').upload_from_filename('/workspace/output/native_c${concurrency}_results.json')"
            else
              echo "WARNING: Benchmark failed or timed out at concurrency ${concurrency}, proceeding..."
            fi
          done

          echo "Final sync of all results to GCS..."
          python3 -c '
          import os
          from google.cloud import storage

          def upload_dir(bucket_name, local_dir, gcs_prefix):
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              for root, dirs, files in os.walk(local_dir):
                  for file in files:
                      local_path = os.path.join(root, file)
                      rel_path = os.path.relpath(local_path, local_dir)
                      blob_path = os.path.join(gcs_prefix, rel_path)
                      blob = bucket.blob(blob_path)
                      blob.upload_from_filename(local_path)
                      print(f"Uploaded {local_path} to gs://{bucket_name}/{blob_path}")

          upload_dir("llama-vllm-results-bucket", "/workspace/output", "gemma-4-e4b-native-bench/g4/tp1-dp8_results")
          '
          echo "All results uploaded successfully."
          pkill -f vllm || true
        volumeMounts:
        - name: output-volume
          mountPath: /workspace/output
        - name: gcs-key
          mountPath: /secret
          readOnly: true
      restartPolicy: Never
      volumes:
      - name: output-volume
        emptyDir: {}
      - name: hf-cache
        emptyDir:
          medium: Memory
          sizeLimit: 100Gi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
      - name: gcs-key
        secret:
          secretName: gcs-key
